name: bagdar

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  google_mlkit_text_recognition: ^0.13.0
  speech_to_text: ^7.3.0
  # Vosk offline STT — used for Kazakh recognition behind the
  # `enableKazakhStackV2` feature flag. Maintained fork of `vosk_flutter`.
  vosk_flutter_2: ^1.0.5
  audioplayers: ^6.1.0
  ffi: ^2.1.4
  cupertino_icons: ^1.0.8
  camera: ^0.11.4
  permission_handler: ^11.3.0
  flutter_vision: ^2.0.0
  flutter_tts: ^4.2.2
  vibration: ^2.0.1
  shared_preferences: ^2.5.4
  flutter_foreground_task: ^8.12.0
  battery_plus: ^6.2.0
  audio_session: ^0.1.21
  geolocator: ^13.0.2
  url_launcher: ^6.3.1
  flutter_compass: ^0.8.0
  http: ^1.2.0
  latlong2: ^0.9.1
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  dio: ^5.4.0
  archive: ^3.6.1
  # Used by `LanguagePackManager` for SHA-256 verification of downloaded packs.
  crypto: ^3.0.3
  connectivity_plus: ^6.0.0
  sensors_plus: ^6.1.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  flutter_native_contact_picker: ^0.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/yolov8n_int8.tflite
    - assets/labels.txt
    - assets/midas_small.ncnn.param
    - assets/midas_small.ncnn.bin
    # Phase 2 — espeak-ng kk voice data unpacked by `EspeakNgEngine` on
    # first activation. Populated by `tools/espeak-ng/build_android.sh`.
    # Until the build script has been run, the directory only carries a
    # README; the engine reports `available = false` and the resolver
    # transparently falls back to the Russian voice.
    - assets/espeak-ng-data/
    # Phase 3 — PaddleOCR multilingual models + Kazakh wordlist for
    # post-correction. `PaddleOcrEngine` unpacks det/cls/rec/keys on
    # first activation; `KkDictionary` decompresses
    # `kk_wordlist.txt.gz`. Until the four model artifacts are added
    # the engine reports `available = false` and `OcrService` falls
    # back to the legacy ML Kit pipeline.
    - assets/paddle_ocr/
    - assets/lang_packs/

  # Primary UI typeface — Inter (SIL OFL 1.1, see assets/fonts/OFL-Inter.txt).
  # Bundled as static weights for reliable fontWeight matching on Android.
  # Full Cyrillic incl. Kazakh-specific glyphs (ә ғ қ ң ө ұ ү һ і). Wired into
  # the theme via BagdarTypography.fontFamily / BagdarTheme.buildMaterialTheme.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800